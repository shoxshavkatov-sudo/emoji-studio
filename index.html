<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRID Emoji Studio</title>
<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js" defer></script>
<script src="engine.js" defer></script>
<script src="templates.js" defer></script>
<script src="app.js" defer></script>
<style>
  :root { color-scheme: dark; --line: rgba(255,255,255,.09); --glass: rgba(20,22,26,.55); }
  * { box-sizing: border-box; }
  body { margin:0; background:#08090b; color:#c9ced3; font-family:-apple-system,'Segoe UI',sans-serif;
    background-image:radial-gradient(1200px 500px at 50% -10%, #17181c 0%, #08090b 60%); }
  header { padding:26px 30px 10px; }
  h1 { color:#fff; font-size:24px; margin:0 0 4px; letter-spacing:.01em; }
  header p { margin:0; font-size:13px; color:#8b9198; }

  /* liquid glass control bar */
  .controls { position:sticky; top:14px; z-index:20; margin:14px 30px 0; display:flex; flex-wrap:wrap;
    gap:16px; align-items:flex-end; padding:16px 20px; border-radius:20px;
    background:var(--glass); -webkit-backdrop-filter:blur(24px) saturate(160%); backdrop-filter:blur(24px) saturate(160%);
    border:1px solid var(--line); box-shadow:0 16px 48px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06); }
  .field { display:flex; flex-direction:column; gap:6px; }
  .field label { font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:#787f87; }
  .field input[type=text] { width:172px; padding:10px 12px; font-size:16px; border-radius:11px;
    border:1px solid var(--line); background:rgba(255,255,255,.05); color:#fff; outline:none; }
  .field input[type=text]:focus { border-color:rgba(255,255,255,.35); }
  .field input[type=color] { width:50px; height:38px; padding:2px; border-radius:11px;
    border:1px solid var(--line); background:rgba(255,255,255,.05); }
  .field input[type=range] { width:150px; accent-color:#fff; }
  .field .val { font-size:12px; color:#fff; }
  .chk { display:flex; align-items:center; gap:7px; font-size:13px; padding-bottom:8px; color:#dfe3e7; }
  .chk input[type=checkbox] { accent-color:#fff; width:15px; height:15px; }

  main { padding:24px 30px 90px; }
  h2 { color:#e8ebee; font-size:13px; margin:26px 0 12px; text-transform:uppercase; letter-spacing:.12em; }
  .grid { display:flex; flex-wrap:wrap; gap:14px; }
  .card { background:rgba(255,255,255,.028); border:1px solid var(--line); border-radius:16px;
    padding:12px 12px 10px; text-align:center; width:172px; cursor:pointer; position:relative;
    content-visibility:auto; contain-intrinsic-size:232px; transition:border-color .15s, background .15s; }
  .card:hover { background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.22); }
  .card.sel { border-color:#fff; background:rgba(255,255,255,.09);
    box-shadow:0 0 0 1px #fff, 0 10px 30px rgba(0,0,0,.4); }
  .card.sel::after { content:'✓'; position:absolute; top:8px; right:10px; width:20px; height:20px;
    border-radius:50%; background:#fff; color:#08090b; font-size:12px; line-height:20px; font-weight:700; }
  .card lottie-player { width:148px; height:148px; display:block; margin:0 auto; filter:grayscale(0%); }
  .card .nm { font-size:11px; margin:6px 0 8px; color:#8b9198; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card button { width:100%; padding:8px 0; font-size:13px; border-radius:10px; border:1px solid #fff;
    background:#e9ebee; color:#08090b; font-weight:600; cursor:pointer; }
  .card button:hover { background:#fff; }
  .card .warn { color:#b9c0c7; font-size:11px; margin-top:5px; min-height:13px; }

  /* floating glass selection bar */
  #selbar { position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(90px); z-index:30;
    display:flex; align-items:center; gap:16px; padding:12px 18px; border-radius:18px;
    background:var(--glass); -webkit-backdrop-filter:blur(24px) saturate(160%); backdrop-filter:blur(24px) saturate(160%);
    border:1px solid var(--line); box-shadow:0 16px 48px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
    transition:transform .25s; }
  #selbar.on { transform:translateX(-50%) translateY(0); }
  #selbar span { color:#fff; font-size:14px; }
  #selbar button { padding:10px 18px; border-radius:12px; border:1px solid #fff; background:#fff; color:#08090b;
    font-size:13px; font-weight:700; cursor:pointer; }
  #selbar .clear { background:transparent; color:#c9ced3; border-color:var(--line); font-weight:400; }

  #status { position:fixed; right:18px; bottom:20px; background:rgba(22,24,28,.92); color:#fff;
    padding:10px 16px; border-radius:12px; border:1px solid var(--line); font-size:13px;
    opacity:0; transition:opacity .3s; pointer-events:none; z-index:40; }
  @media (max-width:640px){ .controls, main { margin-left:12px; margin-right:12px; } main{ padding:12px; } }
</style>
</head>
<body>
<header>
  <h1>GRID Emoji Studio</h1>
  <p>Своё название, цвет и размер → живые превью → .tgs для Telegram (@Stickers → /newemojiset)</p>
</header>

<div class="controls">
  <div class="field">
    <label>Название</label>
    <input type="text" id="word" value="GRID" maxlength="12" spellcheck="false">
  </div>
  <div class="field">
    <label>Цвет текста</label>
    <input type="color" id="color" value="#ffffff">
  </div>
  <div class="field">
    <label>Обводка</label>
    <div class="chk"><input type="checkbox" id="strokeOn"> <input type="color" id="strokeColor" value="#000000"></div>
  </div>
  <div class="field">
    <label>Тон эмодзи</label>
    <div class="chk"><input type="checkbox" id="tintOn"> <input type="color" id="tintColor" value="#ffffff"></div>
  </div>
  <div class="field">
    <label>Размер <span class="val" id="sizeVal">100%</span></label>
    <input type="range" id="size" min="50" max="140" value="100">
  </div>
</div>

<main>
  <h2>intervfxpack · 66</h2>
  <div class="grid" id="pack"></div>
</main>

<div id="selbar"><span id="selcount">Выбрано: 0</span>
  <button id="dlAll">Скачать выбранные</button>
  <button id="selclear" class="clear">Снять</button>
</div>
<div id="status"></div>
</body>
</html>
