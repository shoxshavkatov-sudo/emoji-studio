<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRID Emoji Studio</title>
<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js" defer></script>
<script src="engine.js?v=4" defer></script>
<script src="manifest.js?v=4" defer></script>
<script src="app.js?v=4" defer></script>
<style>
  :root { color-scheme: dark; --line: rgba(255,255,255,.09); --glass: rgba(20,22,26,.62); }
  * { box-sizing: border-box; }
  body { margin:0; background:#08090b; color:#c9ced3; font-family:-apple-system,'Segoe UI',sans-serif;
    background-image:radial-gradient(1200px 500px at 50% -10%, #17181c 0%, #08090b 60%); padding-bottom:190px; }
  header { padding:22px 30px 8px; text-align:center; }
  h1 { color:#fff; font-size:24px; margin:0 0 4px; }
  header p { margin:0; font-size:13px; color:#8b9198; }

  main { padding:16px 30px 40px; }
  h2 { color:#e8ebee; font-size:13px; margin:18px 0 12px; text-transform:uppercase; letter-spacing:.12em; text-align:center; }
  .grid { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; }
  .card { background:rgba(255,255,255,.028); border:1px solid var(--line); border-radius:16px;
    padding:10px; text-align:center; width:158px; cursor:pointer; position:relative;
    transition:border-color .15s, background .15s; }
  .card:hover { background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.22); }
  .card.sel { border-color:#fff; background:rgba(255,255,255,.09);
    box-shadow:0 0 0 1px #fff, 0 10px 30px rgba(0,0,0,.4); }
  .card.sel::after { content:'✓'; position:absolute; top:7px; right:9px; width:20px; height:20px;
    border-radius:50%; background:#fff; color:#08090b; font-size:12px; line-height:20px; font-weight:700; z-index:3; }
  .card .stage { position:relative; width:136px; height:136px; margin:0 auto; border-radius:12px;
    background:rgba(255,255,255,.03); overflow:hidden; }
  .card .stage img.thumb { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .card .stage img.nolist { visibility:hidden; }
  .card lottie-player { position:absolute; inset:0; width:100%; height:100%; }
  .card .nm { font-size:10px; margin-top:7px; color:#8b9198; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .warn { color:#b9c0c7; font-size:10px; min-height:12px; margin-top:3px; }

  /* bottom glass constructor bar: 1 select → 2 style → 3 download */
  #bar { position:fixed; left:14px; right:14px; bottom:14px; z-index:30; display:flex; align-items:center;
    gap:18px; padding:14px 20px; border-radius:22px; flex-wrap:wrap; justify-content:center;
    background:var(--glass); -webkit-backdrop-filter:blur(26px) saturate(170%); backdrop-filter:blur(26px) saturate(170%);
    border:1px solid var(--line); box-shadow:0 18px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.07); }
  .step { display:flex; align-items:center; gap:12px; }
  .stepnum { width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.25); color:#fff; font-size:13px; font-weight:700;
    display:flex; align-items:center; justify-content:center; flex:none; }
  .bar-div { width:1px; height:44px; background:var(--line); flex:none; }
  .selname { color:#fff; font-size:14px; max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:inline-block; }
  .field { display:flex; flex-direction:column; gap:5px; }
  .field label { font-size:9px; text-transform:uppercase; letter-spacing:.09em; color:#787f87; }
  .field input[type=text] { width:132px; padding:8px 10px; font-size:15px; border-radius:10px;
    border:1px solid var(--line); background:rgba(255,255,255,.05); color:#fff; outline:none; }
  .field select { padding:8px 8px; font-size:13px; border-radius:10px; border:1px solid var(--line);
    background:rgba(255,255,255,.05); color:#fff; outline:none; }
  .field input[type=color] { width:44px; height:34px; padding:2px; border-radius:10px;
    border:1px solid var(--line); background:rgba(255,255,255,.05); }
  .field input[type=range] { width:110px; accent-color:#fff; }
  .field .val { font-size:11px; color:#fff; }
  .chk { display:flex; align-items:center; gap:6px; font-size:12px; color:#dfe3e7; }
  .chk input[type=checkbox] { accent-color:#fff; width:14px; height:14px; }
  #dlOne { padding:12px 22px; border-radius:13px; border:1px solid #fff; background:#fff; color:#08090b;
    font-size:14px; font-weight:700; cursor:pointer; }
  #dlOne:hover { background:#e9ebee; }
  #selclear { padding:12px 12px; border-radius:13px; background:transparent; color:#c9ced3;
    border:1px solid var(--line); font-size:14px; cursor:pointer; }

  #status { position:fixed; right:18px; bottom:210px; background:rgba(22,24,28,.95); color:#fff;
    padding:10px 16px; border-radius:12px; border:1px solid var(--line); font-size:13px;
    opacity:0; transition:opacity .3s; pointer-events:none; z-index:40; }
  @media (max-width:760px){
    body { padding-bottom:300px; }
    .bar-div { display:none; }
    #bar { gap:10px; }
  }
</style>
</head>
<body>
<header>
  <h1>GRID Emoji Studio</h1>
  <p>1 — кликни по эмодзи · 2 — настрой текст, шрифт и цвет · 3 — скачай .tgs для Telegram</p>
</header>

<main>
  <h2>intervfxpack · <span id="tplcount">…</span></h2>
  <div class="grid" id="pack"></div>
</main>

<div id="bar">
  <div class="step">
    <span class="stepnum">1</span>
    <div class="field"><label>Эмодзи</label><span id="selname" class="selname">выбери карточку</span></div>
  </div>
  <div class="bar-div"></div>
  <div class="step">
    <span class="stepnum">2</span>
    <div class="field">
      <label for="word">Текст</label>
      <input type="text" id="word" value="GRID" maxlength="12" spellcheck="false">
    </div>
    <div class="field">
      <label for="font">Шрифт</label>
      <select id="font">
        <option value="block">Блок</option>
        <option value="rounded">Скруглённый</option>
        <option value="outline">Контур</option>
      </select>
    </div>
    <div class="field">
      <label for="color">Цвет</label>
      <input type="color" id="color" value="#ffffff">
    </div>
    <div class="field">
      <label>Обводка</label>
      <div class="chk"><input type="checkbox" id="strokeOn"> <input type="color" id="strokeColor" value="#000000"></div>
    </div>
    <div class="field">
      <label>Тон</label>
      <div class="chk"><input type="checkbox" id="tintOn"> <input type="color" id="tintColor" value="#ffffff"></div>
    </div>
    <div class="field">
      <label>Размер <span class="val" id="sizeVal">100%</span></label>
      <input type="range" id="size" min="50" max="140" value="100">
    </div>
  </div>
  <div class="bar-div"></div>
  <div class="step">
    <span class="stepnum">3</span>
    <button id="dlOne">Скачать .tgs</button>
    <button id="selclear" title="Снять выбор">×</button>
  </div>
</div>
<div id="status"></div>
</body>
</html>
