<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>GRID Emoji Studio</title>
<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="engine.js"></script>
<script src="templates.js"></script>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#14181d; color:#aab6c2; font-family:-apple-system,'Segoe UI',sans-serif; }
  header { padding:20px 28px 12px; }
  h1 { color:#fff; font-size:22px; margin:0 0 4px; }
  header p { margin:0; font-size:13px; }
  .controls { position:sticky; top:0; z-index:10; display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end;
    background:#14181dee; padding:14px 28px; border-bottom:1px solid #232b34; }
  .field { display:flex; flex-direction:column; gap:5px; }
  .field label { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#77838f; }
  .field input[type=text] { width:180px; padding:9px 12px; font-size:16px; border-radius:9px; border:1px solid #2c3641;
    background:#1d232b; color:#fff; }
  .field input[type=color] { width:52px; height:36px; padding:2px; border-radius:9px; border:1px solid #2c3641; background:#1d232b; }
  .field input[type=range] { width:150px; }
  .field .val { font-size:12px; color:#fff; }
  .chk { display:flex; align-items:center; gap:7px; font-size:13px; padding-bottom:6px; }
  main { padding:20px 28px 60px; }
  h2 { color:#dfe7ee; font-size:15px; margin:22px 0 12px; text-transform:uppercase; letter-spacing:.08em; }
  .grid { display:flex; flex-wrap:wrap; gap:14px; }
  .card { background:#1d232b; border-radius:14px; padding:12px 12px 10px; text-align:center; width:172px; }
  .card lottie-player { width:148px; height:148px; display:block; margin:0 auto; }
  .card .nm { font-size:11px; margin:6px 0 8px; color:#8d99a6; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card button { width:100%; padding:8px 0; font-size:13px; border-radius:9px; border:1px solid #2c3641;
    background:#27435f; color:#fff; cursor:pointer; }
  .card button:hover { background:#31587c; }
  .card .warn { color:#e5b34a; font-size:11px; margin-top:5px; }
  #status { position:fixed; right:18px; bottom:18px; background:#27435f; color:#fff; padding:10px 16px;
    border-radius:10px; font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; }
</style>
</head>
<body>
<header>
  <h1>GRID Emoji Studio</h1>
  <p>Своё название, цвет и размер → живые превью → скачивай .tgs для Telegram (@Stickers → /newemojiset)</p>
</header>

<div class="controls">
  <div class="field">
    <label>Название</label>
    <input type="text" id="word" value="GRID" maxlength="12" spellcheck="false">
  </div>
  <div class="field">
    <label>Цвет текста</label>
    <input type="color" id="color" value="#ffffff">
  </div>
  <div class="field">
    <label>Обводка</label>
    <div class="chk"><input type="checkbox" id="strokeOn"> <input type="color" id="strokeColor" value="#000000"></div>
  </div>
  <div class="field">
    <label>Размер <span class="val" id="sizeVal">100%</span></label>
    <input type="range" id="size" min="50" max="140" value="100">
  </div>
</div>

<main>
  <h2>intervfxpack (66 эффектов)</h2>
  <div class="grid" id="pack"></div>
</main>
<div id="status"></div>

<script>
window.addEventListener('error', e => {
  const s = document.getElementById('status');
  s.textContent = 'ERR: ' + (e.message || e.type) + (e.filename ? ' @' + e.filename.split('/').pop() + ':' + e.lineno : '');
  s.style.opacity = 1; s.style.background = '#7a2f3a';
});

const state = {
  word: 'GRID', color: '#ffffff', stroke: false, strokeColor: '#000000', size: 1.0,
};

function flash(msg) {
  const s = document.getElementById('status');
  s.textContent = msg; s.style.opacity = 1;
  clearTimeout(s._t); s._t = setTimeout(() => s.style.opacity = 0, 2200);
}

function buildPack(tpl) {
  const r = ES.replaceSlots(tpl.doc, {
    word: state.word, color: state.color, size: state.size,
    stroke: state.stroke, strokeColor: state.strokeColor,
  });
  return r.doc;
}

function makeCard(container, name, label, builder) {
  const card = document.createElement('div');
  card.className = 'card';
  const player = document.createElement('lottie-player');
  player.setAttribute('loop', ''); player.setAttribute('autoplay', '');
  const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = label;
  const btn = document.createElement('button'); btn.textContent = 'Скачать .tgs';
  const warn = document.createElement('div'); warn.className = 'warn';
  btn.addEventListener('click', () => {
    const doc = builder();
    const raw = new TextEncoder().encode(JSON.stringify(doc));
    const gz = pako.gzip(raw);
    if (gz.length > 64 * 1024) { warn.textContent = `⚠ ${Math.round(gz.length/1024)} КБ — больше лимита Telegram 64 КБ`; }
    else warn.textContent = `${Math.round(gz.length/1024)} КБ`;
    const blob = new Blob([gz], { type: 'application/gzip' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${state.word || 'name'}_${name}.tgs`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    flash(`Скачано: ${a.download}`);
  });
  card.append(player, nm, btn, warn);
  container.appendChild(card);
  return { player, builder, name };
}

const cards = [];
const packBox = document.getElementById('pack');
for (const tpl of window.TEMPLATES) {
  cards.push(makeCard(packBox, tpl.name.replace(/[^\w-]+/g, '_').slice(0, 24), tpl.name.slice(0, 24), () => buildPack(tpl)));
}

function rebuildAll() {
  const w = document.getElementById('word').value.trim() || 'GRID';
  state.word = w;
  state.color = document.getElementById('color').value;
  state.stroke = document.getElementById('strokeOn').checked;
  state.strokeColor = document.getElementById('strokeColor').value;
  state.size = Number(document.getElementById('size').value) / 100;
  document.getElementById('sizeVal').textContent = document.getElementById('size').value + '%';
  const errs = [];
  for (const c of cards) {
    try { c.player.load(JSON.stringify(c.builder())); }
    catch (e) { errs.push(c.name + ': ' + e.message); }
  }
  if (errs.length) {
    const s = document.getElementById('status');
    s.textContent = 'BUILD ERRORS: ' + errs.slice(0, 3).join(' | ');
    s.style.opacity = 1; s.style.background = '#7a2f3a';
  }
}

let deb;
function onInput() { clearTimeout(deb); deb = setTimeout(rebuildAll, 700); }
['word', 'color', 'strokeOn', 'strokeColor', 'size'].forEach(id => {
  document.getElementById(id).addEventListener('input', onInput);
});

// lottie-player (Lit) mounts its shadow DOM asynchronously: a load() call in
// the same tick as appendChild is silently dropped. Defer the first build.
setTimeout(rebuildAll, 250);
</script>
</body>
</html>
